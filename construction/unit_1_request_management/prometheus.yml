global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'request-management-service'

scrape_configs:
  - job_name: 'request-management-service'
    static_configs:
      - targets: ['localhost:8080']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
