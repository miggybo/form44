# Development Profile Configuration

# Logging - More verbose for development
logging.level.root=INFO
logging.level.com.accessrequest=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Database - Development settings
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate

# Kafka - Development settings
spring.kafka.bootstrap-servers=localhost:9092

# Redis - Development settings
spring.redis.host=localhost
spring.redis.port=6379

# Security - Development (less strict)
app.jwt.secret=dev-secret-key-for-development-only
app.jwt.expiration=3600000

# Actuator - All endpoints exposed for development
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# External Services - Development (localhost)
app.services.administration.url=http://localhost:8081
app.services.document-management.url=http://localhost:8082
app.services.notification.url=http://localhost:8083
