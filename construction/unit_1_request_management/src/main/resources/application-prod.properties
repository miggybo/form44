# Production Profile Configuration

# Logging - Production settings (less verbose)
logging.level.root=WARN
logging.level.com.accessrequest=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

# Database - Production settings
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# Kafka - Production settings (from environment variables)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Redis - Production settings (from environment variables)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# Security - Production (strict)
app.jwt.secret=${JWT_SECRET:change-this-in-production}
app.jwt.expiration=${JWT_EXPIRATION:1800000}

# Actuator - Limited endpoints for production
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when-authorized

# External Services - Production (from environment variables)
app.services.administration.url=${ADMIN_SERVICE_URL:http://administration-service:8080}
app.services.document-management.url=${DOC_SERVICE_URL:http://document-service:8080}
app.services.notification.url=${NOTIFICATION_SERVICE_URL:http://notification-service:8080}

# Database - Production (from environment variables)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/access_request_db}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:bir*1234}
