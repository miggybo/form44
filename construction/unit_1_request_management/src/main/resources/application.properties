# Application Configuration
spring.application.name=request-management-service
server.port=8080
server.servlet.context-path=/

# Logging Configuration
logging.level.root=INFO
logging.level.com.accessrequest=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/access_request_db
spring.datasource.username=postgres
spring.datasource.password=bir*1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=request-management-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.auto-offset-reset=earliest

# Redis Configuration
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=60000ms
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# Security Configuration
app.jwt.secret=your-secret-key-change-this-in-production-environment-with-strong-key
app.jwt.expiration=1800000

# Actuator Configuration
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true

# API Documentation (Swagger/OpenAPI)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# External Services Configuration
app.services.administration.url=http://localhost:8081
app.services.document-management.url=http://localhost:8082
app.services.notification.url=http://localhost:8083

# Resilience4j Configuration
resilience4j.circuitbreaker.instances.external-service.register-health-indicator=true
resilience4j.circuitbreaker.instances.external-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.external-service.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.external-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.external-service.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.retry.instances.external-service.max-attempts=3
resilience4j.retry.instances.external-service.wait-duration=1000
resilience4j.retry.instances.external-service.retry-exceptions=java.io.IOException,java.net.ConnectException
